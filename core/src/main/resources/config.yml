# Private live copy: plugins/ClaudeControl/config.yml. Never commit a populated key.
# A nonblank ANTHROPIC_API_KEY environment variable overrides this value.
backend: api
api-key: ''
model: claude-opus-5-5
effort: low
max-tokens: 8192
max-tool-iterations: 8
# Applied both globally across the server and separately to each player.
max-turns-per-minute: 4
max-queued-triggers: 32
history-turns: 16
chat-prefix: '<Claude> '
# Prefer authenticated UUIDs. Names must include the exact Floodgate prefix.
owners: []
# Extra command names to deny; the permanent hard denylist still applies.
denied-commands: []
# Automatic events incur API usage. Keep off until the owner enables them.
events-enabled: false
event-interval-minutes: 30

# Approved planning base interval: jitter adds up to 50%, capped at one hour.
# Owner commands persist on/off separately; missing invitation uses approved 30–45 minutes.
initiative-interval-seconds: 1800
